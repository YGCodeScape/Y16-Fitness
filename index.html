<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport & Theme ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F0EFEB" />

    <!-- ── Primary SEO ── -->
    <title>Y16 Fitness — Perfect Your Fitness Path | Personalized Training & Nutrition</title>
    <meta name="description" content="Y16 Fitness is your personal fitness brand. Unlock your potential with personalized training programs, balanced meal plans, expert yoga styles, and a global wellness community." />
    <meta name="keywords" content="Y16 fitness, personal fitness, fitness training, yoga, nutrition plans, meal planning, wellness, strength training, fitness brand, online fitness coach" />
    <meta name="author" content="Y16 Fitness" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://y16fitness.vercel.app/" />

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp) ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://y16fitness.vercel.app/" />
    <meta property="og:site_name"   content="Y16 Fitness" />
    <meta property="og:title"       content="Y16 Fitness — Perfect Your Fitness Path" />
    <meta property="og:description" content="Unlock your full potential with tailored training programs, balanced nutrition, expert yoga styles, and a 500K+ strong wellness community." />
    <meta property="og:locale"       content="en_IN" />

    <!-- ── Favicon ── -->
    <link rel="icon"             type="image/svg+xml" href="/Y16fitness-logo.png" />
    <link rel="apple-touch-icon"                      href="/apple-touch-icon.png" />
    <link rel="manifest"                              href="/site.webmanifest" />

    <!-- ── Preconnect to Google Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter only — removed unused Leckerli One & Limelight -->
    <link
      rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/>
        
    <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=Limelight&display=swap" rel="stylesheet">

    <!-- ── JSON-LD Structured Data ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsOrganization",
      "name": "Y16 Fitness",
      "url": "https://y16fitness.com",
      "logo": "https://y16fitness.com/favicon.svg",
      "description": "Y16 Fitness is a personal fitness brand offering personalized training, balanced nutrition plans, yoga programs, and live wellness events.",
      "sameAs": [
        "https://instagram.com/y16fitness",
        "https://twitter.com/y16fitness",
        "https://facebook.com/y16fitness",
        "https://youtube.com/@y16fitness"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://y16fitness.com/#events"
      },
      "offers": {
        "@type": "Offer",
        "name": "Personalized Fitness Programs",
        "description": "Tailored training, nutrition, and yoga programs for every fitness level."
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
